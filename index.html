  <style id="qv-splash-screen-css">
    #qv-splash{
      position:fixed;
      inset:0;
      z-index:2147483000;
      display:grid;
      place-items:center;
      overflow:hidden;
      color:#ffffff;
      background:
        radial-gradient(circle at 50% 38%,rgba(67,105,255,.22),transparent 34%),
        linear-gradient(180deg,#0d234e 0%,#08162f 100%);
      opacity:1;
      visibility:visible;
      transition:opacity .42s ease,visibility .42s ease;
    }

    #qv-splash.qv-splash-exit{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .qv-splash-inner{
      width:min(420px,calc(100% - 44px));
      display:grid;
      justify-items:center;
      text-align:center;
    }

    .qv-splash-mark{
      position:relative;
      width:88px;
      height:88px;
      display:grid;
      place-items:center;
      margin-bottom:24px;
    }

    .qv-splash-mark::before{
      content:"";
      position:absolute;
      inset:-13px;
      border:1px solid rgba(126,156,255,.18);
      border-radius:50%;
      animation:qv-splash-orbit 1.7s linear infinite;
    }

    .qv-splash-mark img{
      width:88px;
      height:88px;
      display:block;
      filter:brightness(0) invert(1);
      opacity:.98;
      animation:qv-splash-breathe 1.4s ease-in-out infinite;
    }

    .qv-splash-name{
      margin:0;
      color:#ffffff;
      font-family:Inter,Arial,Helvetica,sans-serif;
      font-size:clamp(30px,6vw,42px);
      font-weight:850;
      letter-spacing:-.045em;
    }

    .qv-splash-subtitle{
      margin:9px 0 0;
      color:#aebfe1;
      font-family:Inter,Arial,Helvetica,sans-serif;
      font-size:10px;
      font-weight:800;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    .qv-splash-progress{
      width:min(220px,68vw);
      height:2px;
      margin-top:31px;
      overflow:hidden;
      background:rgba(255,255,255,.13);
    }

    .qv-splash-progress span{
      display:block;
      width:100%;
      height:100%;
      background:linear-gradient(90deg,transparent,#7391ff,#ffffff,transparent);
      transform:translateX(-100%);
      animation:qv-splash-progress 1.05s ease-in-out infinite;
    }

    @keyframes qv-splash-progress{
      0%{transform:translateX(-100%)}
      100%{transform:translateX(100%)}
    }

    @keyframes qv-splash-breathe{
      0%,100%{transform:scale(.97);opacity:.88}
      50%{transform:scale(1);opacity:1}
    }

    @keyframes qv-splash-orbit{
      from{transform:rotate(0deg);border-top-color:rgba(126,156,255,.68)}
      to{transform:rotate(360deg);border-top-color:rgba(126,156,255,.68)}
    }

    @media(max-width:700px){
      .qv-splash-mark,
      .qv-splash-mark img{
        width:74px;
        height:74px;
      }

      .qv-splash-name{
        font-size:34px;
      }
    }

    @media(prefers-reduced-motion:reduce){
      .qv-splash-mark::before,
      .qv-splash-mark img,
      .qv-splash-progress span{
        animation:none;
      }
    }
  </style>

</head>
<body>

  <div id="qv-splash" role="status" aria-label="Loading QuantiValue">
    <div class="qv-splash-inner">
      <div class="qv-splash-mark" aria-hidden="true">
        <img src="/quantum-ring.svg" alt="" width="88" height="88" />
      </div>
      <p class="qv-splash-name">QuantiValue</p>
      <p class="qv-splash-subtitle">Institutional Intelligence</p>
      <div class="qv-splash-progress" aria-hidden="true"><span></span></div>
    </div>
  </div>

  <div id="root"></div>

  <script>
    (() => {
      const removeSplash = () => {
        const splash = document.getElementById("qv-splash");
        if (!splash || splash.dataset.closing === "true") return;

        splash.dataset.closing = "true";
        splash.classList.add("qv-splash-exit");

        window.setTimeout(() => {
          splash.remove();
        }, 460);
      };

      const startedAt = Date.now();
      const minimumVisibleTime = 620;

      const closeWhenReady = () => {
        const remaining = Math.max(0, minimumVisibleTime - (Date.now() - startedAt));
        window.setTimeout(removeSplash, remaining);
      };

      if (document.readyState === "complete") {
        closeWhenReady();
      } else {
        window.addEventListener("load", closeWhenReady, { once: true });
      }

      /* Absolute safety: the splash can never block the site indefinitely. */
      window.setTimeout(removeSplash, 1600);
    })();
  </script>
