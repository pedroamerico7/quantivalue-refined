  <style id="qv-critical-mobile-css">
    /*
      Critical fallback styles.
      These render the page correctly even if a cached Vite HTML file temporarily
      points to an expired hashed stylesheet.
    */
    :root{
      --qv-bg:#070b14;
      --qv-panel:#0d1525;
      --qv-panel-2:#111c31;
      --qv-line:rgba(135,158,205,.18);
      --qv-text:#f7f9ff;
      --qv-muted:#9da9be;
      --qv-blue:#3f66ff;
      --qv-green:#20d891;
      --qv-sans:Inter,Arial,Helvetica,sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--qv-bg)}
    body{
      margin:0;
      min-width:320px;
      overflow-x:hidden;
      color:var(--qv-text);
      background:var(--qv-bg);
      font-family:var(--qv-sans);
      -webkit-font-smoothing:antialiased;
    }
    button,input,select,textarea{font:inherit}
    img,svg{max-width:100%}
    #root,.app-shell{min-height:100vh}
    .brand-loader,.project-progress-trigger,.project-progress-backdrop,.project-progress-modal{display:none!important}
    [data-reveal]{opacity:1!important;transform:none!important;visibility:visible!important}

    .scroll-progress{
      position:fixed!important;
      inset:0 0 auto;
      height:3px;
      z-index:100001;
      background:rgba(255,255,255,.07);
    }
    .scroll-progress>span,.scroll-progress-bar{
      display:block;
      height:100%;
      background:var(--qv-blue);
      transform-origin:left center;
    }

    .site-header,.site-header.is-compact{
      position:fixed!important;
      top:3px!important;
      left:0!important;
      right:0!important;
      width:100%!important;
      min-height:68px!important;
      margin:0!important;
      padding:9px clamp(14px,4vw,72px)!important;
      display:flex!important;
      align-items:center!important;
      justify-content:space-between!important;
      gap:18px!important;
      z-index:100000!important;
      border:0!important;
      border-bottom:1px solid rgba(144,166,210,.18)!important;
      border-radius:0!important;
      background:rgba(9,17,31,.78)!important;
      box-shadow:0 12px 35px rgba(0,0,0,.18)!important;
      backdrop-filter:blur(18px) saturate(130%)!important;
      -webkit-backdrop-filter:blur(18px) saturate(130%)!important;
    }
    .site-header.is-compact{
      min-height:58px!important;
      background:rgba(9,17,31,.66)!important;
    }
    .site-header .logo{
      display:flex!important;
      align-items:center!important;
      gap:11px!important;
      min-width:0;
      color:#fff!important;
      text-decoration:none!important;
    }
    .site-header .logo-symbol{
      width:39px!important;
      height:39px!important;
      flex:0 0 39px!important;
      display:block!important;
      opacity:1!important;
      filter:none!important;
      mix-blend-mode:normal!important;
    }
    .site-header .logo-name{
      display:inline-block!important;
      color:#fff!important;
      font-size:19px!important;
      font-weight:850!important;
      letter-spacing:-.04em!important;
      opacity:1!important;
      mix-blend-mode:normal!important;
      text-shadow:0 1px 8px rgba(0,0,0,.3);
    }
    .site-header nav{
      display:flex;
      align-items:center;
      gap:28px;
      margin-left:auto;
    }
    .site-header nav a{
      color:#bbc6d9;
      font-size:10px;
      font-weight:800;
      letter-spacing:.12em;
      text-decoration:none;
      text-transform:uppercase;
    }
    .site-header nav a.active{color:#6f8cff}
    .site-header .header-offer,.mobile-nav-offer{
      min-height:43px;
      padding:0 19px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      border:1px solid rgba(90,123,255,.55);
      border-radius:4px!important;
      color:#fff;
      background:linear-gradient(135deg,#315cff,#4770ff);
      font-size:9px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      text-decoration:none;
      cursor:pointer;
    }
    .mobile-menu-toggle{display:none}
    main{display:block;padding-top:68px}
    section{max-width:100%}
    .hero,.technology,.thesis,.market-opportunity,.film-strip,.pillars,
    .asset-package,.investor-room,.product-demo,.strategic-buyer-suite,
    .buyer-confidence,.acquisition-command-center,.diligence-room,
    .transaction-faq,.acquire{
      width:100%;
      visibility:visible!important;
      content-visibility:visible!important;
      contain:none!important;
    }

    @media(max-width:700px){
      .site-header,.site-header.is-compact{
        min-height:57px!important;
        padding:6px 12px!important;
      }
      .site-header.is-compact{min-height:52px!important}
      .site-header .logo{gap:8px!important}
      .site-header .logo-symbol{
        width:32px!important;
        height:32px!important;
        flex-basis:32px!important;
      }
      .site-header .logo-name{
        max-width:118px;
        overflow:hidden;
        white-space:nowrap;
        text-overflow:ellipsis;
        font-size:15px!important;
      }
      .site-header .header-offer{
        min-height:35px;
        padding:0 10px;
        font-size:7px;
        white-space:nowrap;
      }
      .mobile-menu-toggle{
        width:38px!important;
        height:38px!important;
        padding:0!important;
        display:grid!important;
        place-items:center!important;
        flex:0 0 38px!important;
        border:1px solid rgba(255,255,255,.14)!important;
        border-radius:3px!important;
        color:#fff!important;
        background:rgba(255,255,255,.055)!important;
      }
      .site-header nav{
        position:fixed!important;
        top:60px!important;
        left:8px!important;
        right:8px!important;
        width:auto!important;
        max-height:calc(100dvh - 70px)!important;
        padding:16px!important;
        display:none!important;
        overflow-y:auto!important;
        flex-direction:column!important;
        align-items:stretch!important;
        gap:5px!important;
        border:1px solid var(--qv-line)!important;
        border-radius:4px!important;
        background:rgba(9,17,31,.98)!important;
        box-shadow:0 22px 55px rgba(0,0,0,.4)!important;
      }
      .site-header nav.mobile-open{display:flex!important}
      .site-header nav a{
        min-height:43px;
        padding:0 12px;
        display:flex;
        align-items:center;
        border-bottom:1px solid rgba(255,255,255,.06);
        font-size:10px;
      }
      main{padding-top:57px}
      .hero,.technology,.thesis,.market-opportunity,.film-strip,.pillars,
      .asset-package,.investor-room,.product-demo,.strategic-buyer-suite,
      .buyer-confidence,.acquisition-command-center,.diligence-room,
      .transaction-faq,.acquire{
        min-width:0!important;
        max-width:100%!important;
        overflow:hidden!important;
      }
      .hero-content,.dashboard-showcase,.dashboard-body,.dashboard-main,
      .strategic-thesis,.strategic-highlights,.strategic-application-grid,
      .strategic-validation,.product-demo-shell,.demo-control-panel,
      .demo-output-panel,.buyer-trust-grid,.buyer-process-grid,
      .command-metrics,.command-download-grid,.command-timeline{
        width:100%!important;
        min-width:0!important;
        max-width:100%!important;
      }
      .dashboard-body,.dashboard-main{display:block!important}
      .dashboard-sidebar{display:none!important}
      .dashboard-kpis,.strategic-highlights,.strategic-application-grid,
      .buyer-trust-grid,.buyer-process-grid,.buyer-faq-list,
      .command-metrics,.command-download-grid,.command-timeline{
        display:grid!important;
        grid-template-columns:1fr!important;
      }
      .dashboard-chart,.dashboard-chart svg{
        width:100%!important;
        min-height:130px!important;
      }
    }
  </style>

</head>
